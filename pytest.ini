[pytest]
addopts = --strict-markers
pythonpath = src
markers =
    local_integration: local control-plane integration tests that do not load model weights
    model_metadata: tests that inspect canonical real-model metadata
    cluster(requires_profile=False): tests that require the validated two-host Ring cluster; real-model stages set requires_profile=True
    live_api: tests that require an explicitly supplied loopback API endpoint
