[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen32-cluster"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx==0.32.2",
    "mlx-lm==0.31.3",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "uvicorn==0.52.4",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
qwen32-cluster = "qwen32_cluster.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
